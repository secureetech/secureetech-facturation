{% extends "base.html" %}
{% block title %}Connexion - SecureeTech{% endblock %}
{% block content %}
<div style="max-width:400px; margin:6vh auto;">
  <div class="carte">
    <div style="background:var(--violet-nuit); padding:1.8rem 1.6rem; color:#fff;"><img src="{{ url_for('static', filename='logo-secureetech.png') }}" alt="" style="height:52px;display:block;margin:0 auto 10px;">
      <div class="marque" style="font-size:1.25rem;">
        <span class="point"></span> SecureeTech
      </div>
      <div style="color:rgba(255,255,255,.65); font-size:.88rem; margin-top:.35rem;">
        Espace clients et paiements
      </div>
    </div>
    <div class="carte-corps">
      {% if error %}
      <div style="background:rgba(204,24,24,.08); color:#cc1818; padding:.65rem .85rem;
                  border-radius:7px; font-size:.88rem; margin-bottom:1rem;">
        {{ error }}
      </div>
      {% endif %}
      <form method="post">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autofocus autocomplete="current-password">
        <button type="submit" style="width:100%; margin-top:1rem;">Se connecter</button>
      </form>
    </div>
  </div>
  <p style="text-align:center; color:var(--gris); font-size:.8rem; margin-top:1rem;">
    Accès réservé — SecureeTech
  </p>
</div>
{% endblock %}
