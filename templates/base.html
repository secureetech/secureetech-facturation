<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secureetech{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Charte reprise de la facture Secureetech */
      --orange: #f07800; --orange-fonce: #c05a00;
      --violet: #2a0c52; --violet-nuit: #0e011d;
      --encre: #201620; --gris: #8a8590; --gris-clair: #f4f0f5;
      --bordure: #e6e0ea; --fond: #faf8fb; --blanc: #fff;
      --creme: #fbf1e7; --vert: #1f9d55;
      --rayon: 10px; --ombre: 0 1px 3px rgba(32,22,32,.07), 0 8px 24px rgba(32,22,32,.06);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
           background:var(--fond); color:var(--encre); font-size:15px; line-height:1.5;
           -webkit-font-smoothing:antialiased; }
    .navbar { background:var(--violet-nuit); color:#fff; padding:0 2rem; display:flex;
              justify-content:space-between; align-items:center; height:60px; }
    .marque { font-weight:700; font-size:1.05rem; letter-spacing:-.01em; display:flex;
              align-items:center; gap:.55rem; }
    .navbar { border-bottom:3px solid var(--orange); }
    .liens { display:flex; align-items:center; gap:.25rem; }
    .navbar a { color:rgba(255,255,255,.78); text-decoration:none; padding:.45rem .8rem;
                border-radius:6px; font-size:.9rem; font-weight:500; transition:background .15s,color .15s; }
    .navbar a:hover { color:#fff; background:rgba(255,255,255,.09); }
    .badge-role { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em;
                  padding:.2rem .5rem; border-radius:4px; background:rgba(255,255,255,.12);
                  color:rgba(255,255,255,.8); margin-left:.5rem; }
    .container { max-width:1180px; margin:2rem auto; padding:0 1.5rem; }
    h2 { font-size:1.45rem; font-weight:650; letter-spacing:-.02em; margin-bottom:.35rem; }
    h3 { font-size:1.05rem; font-weight:600; margin:2rem 0 .75rem; }
    .sous-titre { color:var(--gris); font-size:.92rem; margin-bottom:1.5rem; }
    .carte { background:var(--blanc); border:1px solid var(--bordure); border-radius:var(--rayon);
             box-shadow:var(--ombre); overflow:hidden; }
    .carte + .carte { margin-top:1.25rem; }
    .carte-corps { padding:1.25rem 1.4rem; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1rem; margin:1.5rem 0; }
    .stat { background:var(--blanc); border:1px solid var(--bordure); border-left:3px solid var(--orange);
            border-radius:var(--rayon); padding:1.1rem 1.25rem; box-shadow:var(--ombre); }
    .stat .libelle { color:var(--gris); font-size:.8rem; text-transform:uppercase;
                     letter-spacing:.05em; font-weight:600; }
    .stat .valeur { font-size:1.65rem; font-weight:680; letter-spacing:-.02em; margin-top:.3rem; }
    table { width:100%; border-collapse:collapse; background:var(--blanc); }
    thead th { background:var(--gris-clair); color:var(--orange-fonce); font-size:.76rem; font-weight:650;
               text-transform:uppercase; letter-spacing:.05em; text-align:left; padding:.7rem 1rem;
               border-bottom:1px solid var(--bordure); white-space:nowrap; }
    thead th a { color:inherit; text-decoration:none; }
    thead th a:hover { color:var(--orange); }
    tbody td { padding:.8rem 1rem; border-bottom:1px solid var(--bordure); vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover { background:#fafcfd; }
    .num { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
    .centre { text-align:center; }
    .discret { color:var(--gris); font-size:.84rem; }
    .tag { display:inline-block; background:rgba(240,120,0,.12); color:var(--orange-fonce);
           padding:.15rem .5rem; border-radius:4px; font-size:.76rem; font-weight:600; margin-right:.25rem; }
    .tag.vert { background:rgba(31,157,85,.12); color:var(--vert); }
    .tag.gris { background:var(--gris-clair); color:var(--gris); }
    .filtres { background:var(--blanc); border:1px solid var(--bordure); border-radius:var(--rayon);
               padding:1.1rem 1.25rem; margin-bottom:1.25rem; box-shadow:var(--ombre); }
    label { display:block; font-size:.78rem; color:var(--gris); font-weight:600; margin-bottom:.3rem; }
    input, select { width:100%; padding:.55rem .7rem; border:1px solid var(--bordure); border-radius:7px;
                    font-size:.92rem; font-family:inherit; background:var(--blanc); color:var(--encre);
                    transition:border-color .15s, box-shadow .15s; }
    input:focus, select:focus { outline:none; border-color:var(--orange);
                                box-shadow:0 0 0 3px rgba(240,120,0,.18); }
    button, .bouton { background:var(--orange-fonce); color:#fff; border:none; padding:.58rem 1.1rem;
                      border-radius:7px; font-size:.92rem; font-weight:600; font-family:inherit;
                      cursor:pointer; text-decoration:none; display:inline-block; white-space:nowrap;
                      transition:background .15s; }
    button:hover, .bouton:hover { background:#a24b00; }
    .bouton.secondaire { background:var(--blanc); color:var(--orange-fonce); border:1px solid var(--bordure); }
    .bouton.secondaire:hover { background:var(--gris-clair); }
    a { color:var(--orange-fonce); }
    .vide { text-align:center; padding:3rem 1.5rem; color:var(--gris); }
    @media (max-width:760px) {
      .navbar { padding:.6rem 1rem; height:auto; flex-direction:column; align-items:flex-start; }
      .liens { flex-wrap:wrap; }
      .container { padding:0 .9rem; margin:1.2rem auto; }
      thead { display:none; }
      tbody td { display:block; border:none; padding:.3rem 1rem; }
      tbody tr { display:block; border-bottom:1px solid var(--bordure); padding:.7rem 0; }
      .num { text-align:left; }
    }
  </style>
</head>
<body>
  {% if role %}
  <div class="navbar">
    <div class="marque">
      <img src="{{ url_for("static", filename="logo-secureetech.png") }}" alt="" style="height:26px;">
      <span style="letter-spacing:.14em;">SECUREETECH</span>
      <span class="badge-role">{{ 'Administration' if est_admin else 'Commercial' }}</span>
    </div>
    <div class="liens">
      {% if est_admin %}
        <a href="{{ url_for('index') }}">Tableau de bord</a>
        <a href="{{ url_for('clients') }}">Clients</a>
        <a href="{{ url_for('paiements') }}">Paiements</a>
        <a href="{{ url_for('factures') }}">Factures</a>
      {% endif %}
      <a href="{{ url_for('recherche') }}">Recherche</a>
      <a href="{{ url_for('deconnexion') }}">Déconnexion</a>
    </div>
  </div>
  {% endif %}
  <div class="container">{% block content %}{% endblock %}</div>
</body>
</html>
